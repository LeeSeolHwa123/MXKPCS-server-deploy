<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MXKPCS</title>
    <style>
      html, body, #root { margin: 0; min-width: 100%; min-height: 100%; }
      .mxk-db-loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F8F9FA;
      }
      .mxk-db-loading-card {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 22px;
        background: #FFFFFF;
        border: 1px solid #EFEFF1;
        border-radius: 14px;
        box-shadow: 0 1px 2px rgba(26,32,32,.04), 0 4px 16px rgba(26,32,32,.05);
      }
      .mxk-db-loading-spinner {
        width: 28px;
        height: 28px;
        box-sizing: border-box;
        border: 3px solid #DFDFE3;
        border-top-color: #1A2020;
        border-radius: 50%;
        animation: mxk-db-loading-rotate .8s linear infinite;
      }
      @keyframes mxk-db-loading-rotate {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mxk-db-loading-overlay" role="status" aria-live="polite" aria-busy="true" aria-label="XRF 화면을 불러오는 중입니다.">
        <div class="mxk-db-loading-card">
          <div class="mxk-db-loading-spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <noscript>이 사이트를 사용하려면 JavaScript를 활성화해야 합니다.</noscript>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
